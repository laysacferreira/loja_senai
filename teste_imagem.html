<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste de imagens</title>
<style>
        body {
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .grade {
            display: grid;
            grid-template-columns: repeat(3, 180px);
            gap: 16px;
        }
        .grade div {
            display: grid;
            justify-items: center;
            gap: 8px;
            padding: 12px;
            border: 1px solid #c8cfdc;
            border-radius: 10px;
        }
        .grade img {
            width: 110px;
            height: 110px;
            object-fit: contain;
        }
</style>
</head>
<body>
    <h1>Teste de imagens</h1>
<p>As duas primeiras vêm da internet (link). A terceira vem da pasta assets/imagens.</p>
 
<div class="grade">
    <div>
        <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Laptop/3D/laptop_3d.png" alt="Notebook">
        <b>Online (link)</b>
    </div>
    <div>
        <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Headphone/3D/headphone_3d.png%22 alt="Fone de ouvido">
        <b>Online (link)</b>
    </div>
    <div>
        <img src="assets/imagens/logo.png" alt="Logo da loja">
        <b>Local (pasta)</b>
    </div>
</div>
</body>
</html>
